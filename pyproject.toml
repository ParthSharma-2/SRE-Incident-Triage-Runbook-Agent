[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-triage-agent"
version = "0.1.0"
description = "Operational DevOps/SRE incident triage and runbook agent with open-source LLM support and simulated dry-run execution"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "click>=8.5",
    "rich>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
sre-agent = "sre_triage_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
addopts = "-ra"
